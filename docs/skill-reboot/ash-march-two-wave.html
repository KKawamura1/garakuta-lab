<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>灰火の行軍 — 二波の操作試作</title>
<style>
  :root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
  *{box-sizing:border-box} body{background:#161923;color:#f4eee0;margin:0}
  main{max-width:480px;margin:auto;padding:8px 10px 18px}
  h1{font-size:19px;margin:5px 0} p{font-size:12px;line-height:1.5;color:#d4c9bb;margin:4px 0 8px}
  #top{display:flex;justify-content:space-between;font-size:13px;min-height:26px}
  canvas{display:block;width:100%;height:auto;aspect-ratio:390/560;background:#262934;border:1px solid #67625b;border-radius:9px;touch-action:none}
  #below{display:flex;gap:8px;margin-top:7px} button{background:#574132;color:#fff3e0;border:1px solid #af8661;border-radius:9px;padding:11px 12px;font-size:15px;min-height:48px}
  button:disabled{opacity:.45} #rush{flex:1} #start{flex:1} label{font-size:13px;display:block;margin:6px 0}
  #trace{min-height:40px;background:#27292f;padding:7px;border-radius:7px;font-size:13px;margin-top:8px;line-height:1.35}
  details{font-size:12px;line-height:1.5;color:#d9d0c0;margin-top:10px} summary{cursor:pointer}
</style>
<main>
<h1>灰火の行軍　<span style="font-size:12px;color:#e9b873">二波・図形試作</span></h1>
<p>画面をドラッグして灰火と五人を動かす。指を離すと停止。攻撃は自動。次波を早く呼ぶ「先駆け」は任意。</p>
<div id="top"><span id="status">準備中</span><span id="next">次波：北の群れ・射手</span></div>
<canvas id="field" width="390" height="560" aria-label="灰火と五人と敵の戦場"></canvas>
<div id="below"><button id="start">出発／最初から</button><button id="rush" disabled>先駆け OFF</button></div>
<label><input type="checkbox" id="combo" checked> 予約技能を使う（火種・返し盾・震脚・戦地回収）</label>
<div id="trace">防御 → 反射 → 撃破 → 火種 → 震脚が本当に起きるか試す。</div>
<details><summary>二波だけの仮ルールと限界</summary>初期5人の自動攻撃。予約ONで4つの追加技能を最初から付ける（本案の段階解禁を省略）。敵が残っていても、先駆けONなら5秒後に次波を呼ぶ。OFFでは全滅か25秒。灰火HPが0で敗北、二波全滅で勝利。図形・数値・敵出現は観察用の仮置き。iPhoneの操作感・面白さ・全十二波のバランスは未検証。</details>
</main>
<script>
(() => {
  'use strict';
  const c=document.querySelector('#field'), g=c.getContext('2d');
  const startButton=document.querySelector('#start'), rushButton=document.querySelector('#rush');
  const status=document.querySelector('#status'), next=document.querySelector('#next'), trace=document.querySelector('#trace');
  const colors={H:'#ec735c',G:'#dbad69',Z:'#9cbded',T:'#8fd1a2',N:'#d1b9e8'};
  const offsets={H:[27,-12],G:[-28,-12],Z:[25,23],T:[-25,23],N:[0,-38]};
  let s=null, pointer=null, last=0, id=0;
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const pos=k=>({x:s.x+offsets[k][0],y:s.y+offsets[k][1]});
  const living=()=>s.enemies.filter(e=>e.hp>0);
  const note=t=>{trace.textContent=t;s.notes.unshift({t,time:s.time});s.notes=s.notes.slice(0,4)};
  function reset(){
    s={x:195,y:310,hp:12,hero:{H:2,G:2,Z:2,T:2,N:2},cool:{H:0,G:0,Z:0,T:0,N:0},
      shield:0,time:0,wave:0,waveTime:0,clearAt:null,fastAt:null,fast:false,kill:0,
      combo:document.querySelector('#combo').checked,enemies:[],shots:[],notes:[],fx:[],end:null};
    pointer=null;last=performance.now();rushButton.disabled=false;rushButton.textContent='先駆け OFF';
    spawn();note('最初の撃破から、次の敵へ届くか観察する。');
  }
  function spawn(){
    if(s.wave>=2)return;
    s.wave++;s.waveTime=s.time;s.clearAt=null;s.fastAt=s.fast?s.time+5:null;
    for(const k of Object.keys(s.hero)) if(s.hero[k]<=0)s.hero[k]=1;
    const count=s.wave===1?7:10;
    for(let i=0;i<count;i++){
      const north=s.wave===2||i%3===0;
      const x=north?42+(i*43)%305:(i%2?24:366);
      const y=north?24+(i%3)*12:70+(i*69)%400;
      const shooter=(s.wave===1?i===0:i===0||i===5);
      s.enemies.push({id:id++,x,y,hp:shooter?2:3,max:shooter?2:3,r:shooter?11:9,
        shooter,shotAt:s.time+1.4+i*.19,speed:shooter?23:31});
    }
    note(`第${s.wave}波：${s.wave===1?'小敵6・射手1':'小敵8・射手2'}が到着`);
  }
  function fire(x,y,target,damage,speed,color,origin,cap=1){
    const n=Math.max(.001,Math.hypot(target.x-x,target.y-y));
    s.shots.push({x,y,vx:(target.x-x)/n*speed,vy:(target.y-y)/n*speed,damage,color,origin,
      ttl:2.8,side:'ally',left:cap,seen:new Set()});
  }
  function hurt(e,amount,origin){
    if(e.hp<=0)return;
    e.hp-=amount;
    if(e.hp>0)return;
    s.fx.push({x:e.x,y:e.y,kind:'kill',age:0});
    s.kill++; const route=origin.length?origin.join(' → '):'通常攻撃';
    note(`${route} → ${s.kill}体目を撃破`);
    if(s.combo){
      if(s.kill%6===0&&s.hp<12){s.hp++;note(`${route} → ツグミの戦地回収、灰火+1`)}
      if(s.kill%3===0){
        note(`${route} → ゴウの震脚`);
        s.fx.push({x:pos('G').x,y:pos('G').y,kind:'shock',age:0});
        for(const other of [...living()])if(Math.hypot(other.x-s.x+28,other.y-s.y+12)<76)hurt(other,2,[...origin,'震脚']);
      }
      // Each real enemy dies once; embers that kill another real enemy can continue the chain.
      for(let i=0;i<2;i++){
        const targets=living().filter(t=>Math.hypot(t.x-e.x,t.y-e.y)<145).sort((a,b)=>dist(a,e)-dist(b,e));
        if(targets.length)fire(e.x,e.y,targets[i%targets.length],1,205,colors.H,[...origin,'火種']);
      }
    }
  }
  function aim(k,range,farthest=false){
    const p=pos(k), possible=living().filter(e=>dist(e,p)<range);
    possible.sort((a,b)=>(dist(a,p)-dist(b,p))*(farthest?-1:1));return possible[0];
  }
  function heroActions(dt){
    for(const k of Object.keys(s.cool))s.cool[k]-=dt;
    s.shield-=dt;
    const H=aim('H',230);if(H&&s.hero.H>0&&s.cool.H<=0){fire(pos('H').x,pos('H').y,H,1,230,colors.H,['ヒバナ']);s.cool.H=1.2}
    const Z=aim('Z',260,true);if(Z&&s.hero.Z>0&&s.cool.Z<=0){fire(pos('Z').x,pos('Z').y,Z,2,260,colors.Z,['ゲンゾウ'],2);s.cool.Z=2}
    const G=aim('G',64);if(G&&s.hero.G>0&&s.cool.G<=0){
      hurt(G,2,['ゴウ']);const n=Math.max(1,dist(G,pos('G')));G.x+=(G.x-pos('G').x)/n*16;G.y+=(G.y-pos('G').y)/n*16;s.cool.G=1.8;
    }
    const N=aim('N',51);if(N&&s.hero.N>0&&s.cool.N<=0){hurt(N,1,['ナギ']);s.cool.N=2.5}
    if(s.hero.T>0&&s.cool.T<=0){
      const low=Object.keys(s.hero).find(k=>s.hero[k]<2);
      if(low){s.hero[low]++;note(`ツグミが${low}を治療`)}
      else if(s.hp<12){s.hp++;note('ツグミが灰火を治療')}
      s.cool.T=5;
    }
  }
  function enemyActions(dt){
    for(const e of living()){
      const dx=s.x-e.x,dy=s.y-e.y,n=Math.max(1,Math.hypot(dx,dy));
      if(!e.shooter||n>150){e.x+=dx/n*e.speed*dt;e.y+=dy/n*e.speed*dt}
      if(e.shooter&&e.shotAt<s.time){
        e.shotAt=s.time+2.7;const speed=140;
        s.shots.push({x:e.x,y:e.y,vx:dx/n*speed,vy:dy/n*speed,ttl:3.5,side:'enemy',source:e});
      }
      if(!e.shooter&&n<16){e.hp=0;s.hp--;note('小敵が灰火に接触：HP−1')}
    }
  }
  function shots(dt){
    for(const p of s.shots){
      p.ttl-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.side==='ally'){
        for(const e of living())if(!p.seen.has(e.id)&&Math.hypot(e.x-p.x,e.y-p.y)<e.r+4){
          p.seen.add(e.id);hurt(e,p.damage,p.origin);p.left--;if(p.left<=0){p.ttl=0;break}
        }
      }else{
        // Nagi intercepts only a bullet that visibly crosses the front shield.
        const N=pos('N');
        if(s.hero.N>0&&s.shield<=0&&Math.hypot(N.x-p.x,N.y-p.y)<19){
          p.ttl=0;s.shield=2;note('ナギが敵弾を受けた');
          s.fx.push({x:N.x,y:N.y,kind:'shield',age:0});
          if(s.combo&&p.source.hp>0)fire(N.x,N.y,p.source,2,245,colors.N,['ナギ盾','返し盾']);
          continue;
        }
        for(const k of Object.keys(s.hero))if(s.hero[k]>0&&Math.hypot(pos(k).x-p.x,pos(k).y-p.y)<9){
          s.hero[k]--;p.ttl=0;note(`${k}が被弾${s.hero[k]===0?'、この波は倒れる':''}`);break;
        }
        if(p.ttl>0&&Math.hypot(s.x-p.x,s.y-p.y)<10){s.hp--;p.ttl=0;note('敵弾が灰火へ：HP−1')}
      }
    }
    s.shots=s.shots.filter(p=>p.ttl>0&&p.x>-20&&p.x<410&&p.y>-20&&p.y<580);
  }
  function step(dt){
    if(!s||s.end)return;
    s.time+=dt;
    if(pointer){const n=Math.hypot(pointer.dx,pointer.dy);if(n>7){
      const scale=Math.min(1,n/45);s.x=Math.max(45,Math.min(345,s.x+pointer.dx/n*105*dt*scale));
      s.y=Math.max(58,Math.min(510,s.y+pointer.dy/n*105*dt*scale));
    }}
    heroActions(dt);enemyActions(dt);shots(dt);
    for(const effect of s.fx)effect.age+=dt;
    s.fx=s.fx.filter(effect=>effect.age<.55);
    if(s.hp<=0){s.hp=0;s.end='敗北';note('灰火が消えた');return}
    if(!living().length){
      if(s.wave===2){s.end='二波を突破';note('二波を突破。十二波の面白さは未検証');return}
      if(s.clearAt===null)s.clearAt=s.time+1;
    }else s.clearAt=null;
    if(s.wave<2&&((s.clearAt!==null&&s.time>=s.clearAt)||(s.fast&&s.fastAt!==null&&s.time>=s.fastAt)||s.time-s.waveTime>=25))spawn();
    status.textContent=`第${s.wave}/2波　灰火 ${s.hp}/12　討伐 ${s.kill}`;
    next.textContent=s.wave===1?`次波：北の群れ・射手 ${s.fast?`残り${Math.max(0,s.fastAt-s.time).toFixed(1)}秒`:''}`:'最後の波';
  }
  function draw(){
    g.clearRect(0,0,390,560);g.fillStyle='#252934';g.fillRect(0,0,390,560);
    g.strokeStyle='#414651';g.lineWidth=1;for(let x=30;x<390;x+=60){g.beginPath();g.moveTo(x,0);g.lineTo(x,560);g.stroke()}
    for(let y=30;y<560;y+=60){g.beginPath();g.moveTo(0,y);g.lineTo(390,y);g.stroke()}
    if(!s)return;
    g.fillStyle='#dba86c';g.beginPath();g.arc(s.x,s.y,12,0,7);g.fill();
    for(const k of Object.keys(s.hero)){
      const p=pos(k);g.globalAlpha=s.hero[k]?1:.25;g.fillStyle=colors[k];g.beginPath();g.arc(p.x,p.y,10,0,7);g.fill();
      g.globalAlpha=1;g.fillStyle='#18191b';g.font='bold 11px system-ui';g.textAlign='center';g.fillText(k,p.x,p.y+4);
      g.fillStyle='#fff0cf';g.font='10px system-ui';g.fillText('♥'.repeat(s.hero[k]),p.x,p.y-14);
    }
    for(const e of living()){
      g.fillStyle=e.shooter?'#b178c4':'#a6ab9b';g.beginPath();g.arc(e.x,e.y,e.r,0,7);g.fill();
      g.fillStyle='#191b20';g.font='bold 11px system-ui';g.textAlign='center';g.fillText(e.hp,e.x,e.y+4);
    }
    for(const effect of s.fx){
      const t=effect.age/.55;g.globalAlpha=1-t;
      g.strokeStyle=effect.kind==='shield'?colors.N:effect.kind==='shock'?colors.G:colors.H;
      g.lineWidth=effect.kind==='shock'?5:3;g.beginPath();
      g.arc(effect.x,effect.y,effect.kind==='shock'?12+65*t:5+24*t,0,7);g.stroke();g.globalAlpha=1;
    }
    for(const p of s.shots){g.fillStyle=p.side==='enemy'?'#ffb0a4':p.color;g.beginPath();g.arc(p.x,p.y,p.side==='enemy'?4:3,0,7);g.fill()}
    if(s.end){g.fillStyle='#10141dc9';g.fillRect(0,220,390,110);g.fillStyle='#fff0ce';g.textAlign='center';g.font='bold 25px system-ui';g.fillText(s.end,195,280)}
  }
  function loop(now){const dt=Math.min(.04,(now-last)/1000||.016);last=now;step(dt);draw();requestAnimationFrame(loop)}
  c.addEventListener('pointerdown',e=>{if(!s||s.end)return;c.setPointerCapture(e.pointerId);pointer={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0}});
  c.addEventListener('pointermove',e=>{if(pointer&&pointer.id===e.pointerId){pointer.dx=e.clientX-pointer.x;pointer.dy=e.clientY-pointer.y}});
  const release=e=>{if(pointer&&pointer.id===e.pointerId)pointer=null};c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);
  startButton.addEventListener('click',reset);
  rushButton.addEventListener('click',()=>{if(!s||s.end||s.wave>=2)return;s.fast=!s.fast;s.fastAt=s.fast?s.time+5:null;rushButton.textContent=`先駆け ${s.fast?'ON':'OFF'}`;note(s.fast?'五秒後、次波を早く呼ぶ':'先駆けを止めた')});
  last=performance.now();requestAnimationFrame(loop);
})();
</script>
</html>
