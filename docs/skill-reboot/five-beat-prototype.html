<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>五拍先までに倒せ — 独立試作</title>
<style>
:root{color-scheme:dark;--bg:#111518;--panel:#1b2227;--line:#354047;--text:#f1eadb;--muted:#a9b4b5;--gold:#f4c76c;--red:#ec796d;--mint:#88d5bc}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#12181d,#0e1115);color:var(--text);font:15px/1.45 system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}main{max-width:550px;margin:auto;padding:16px 14px 28px}
h1{font-size:23px;line-height:1.2;margin:4px 0 5px;letter-spacing:.03em}.sub{color:var(--muted);font-size:12px;margin:0 0 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.topline{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:.08em;font-weight:800}.small{font-size:12px;color:var(--muted)}
.progress{display:flex;gap:3px;margin:10px 0}.progress i{height:6px;flex:1;border-radius:5px;background:#3a4146}.progress i.done{background:var(--mint)}.progress i.now{background:var(--gold)}
.clock{display:flex;gap:7px;margin:12px 0 4px}.clock span{width:28px;height:28px;border-radius:50%;border:2px solid #657176;background:#263036}.clock span.used{background:var(--gold);border-color:var(--gold);box-shadow:0 0 13px #f4c76c66}.clock span.extra{border-style:dashed}.clocklabel{font-size:13px;color:var(--muted)}
.enemy{padding:9px 10px;border:1px solid #485158;border-radius:10px;margin:7px 0;background:#232c31;display:flex;align-items:center;gap:10px}.enemy.front{border-color:#ac8b5b}.enemy .name{min-width:64px;font-weight:700}.enemy .bar{height:7px;border-radius:5px;background:#4b3636;flex:1;overflow:hidden}.enemy .bar i{display:block;background:var(--red);height:100%}.enemy .hp{font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.forecast{border-top:1px solid var(--line);padding-top:9px;margin-top:9px;color:var(--muted);font-size:13px}.forecast b{color:var(--text)}
.team{display:flex;gap:5px;margin:9px 0}.hero{flex:1;min-width:0;border:1px solid var(--line);background:#222c31;border-radius:10px;padding:7px 2px;min-height:78px;text-align:center;font-size:12px}.hero strong{display:block;font-size:14px}.hero .v{display:block;font-variant-numeric:tabular-nums;white-space:nowrap}.hero.next{border-color:var(--gold);box-shadow:0 0 0 2px #f4c76c33}.hero.selected{outline:2px solid var(--mint)}.hero.dead{opacity:.45}
.controls{display:flex;gap:7px;margin:12px 0}.controls button{border:1px solid #877046;border-radius:9px;background:#4d3e27;min-height:44px;padding:8px 12px;flex:1;font-weight:750}.controls button.primary{background:var(--gold);color:#221c13}.controls button.reset{flex:.8;background:#252d30;border-color:var(--line);font-weight:500}
.notice{font-size:13px;color:var(--muted);min-height:20px}.result{font-size:17px;font-weight:750;color:var(--gold);min-height:24px;margin:9px 0}
details summary{cursor:pointer;color:var(--gold);font-weight:700}.option{border-top:1px solid var(--line);padding:9px 0}.option:first-of-type{margin-top:10px}.choices{display:flex;gap:6px;margin-top:6px}.option button{flex:1;min-width:0;text-align:left;border:1px solid var(--line);border-radius:7px;background:#303b40;padding:7px;font-size:12px}.option button b,.option button small{display:block}.option button small{color:var(--muted);font-size:11px}.option button.active{border-color:var(--gold);color:var(--gold)}
.log{list-style:none;margin:9px 0 0;padding:0;max-height:170px;overflow:auto}.log li{font-size:12px;border-bottom:1px solid #313a40;padding:5px 0}.log li:first-child{color:var(--gold)}
.warning{font-size:12px;color:var(--muted)}
@media(max-width:360px){main{padding:12px 9px}.hero{font-size:11px}.hero strong{font-size:12px}.clock span{width:25px;height:25px}}
</style>
</head>
<body><main>
<header><div class="eyebrow">未採用の実験 / 五人と十二波</div><h1>五拍先までに倒せ</h1><p class="sub">技が使う拍を見て、敵の反撃より先に五人を繋ぐ。実装済みの『灰の遠征』とは独立した小試作。</p></header>
<section class="panel" aria-label="戦況">
 <div class="topline"><strong id="waveTitle">第1波</strong><span class="small" id="phase">出発前</span></div>
 <div id="progress" class="progress" aria-label="十二波の進捗"></div>
 <div class="clock" id="clock" aria-label="敵の行動まで"></div><div class="clocklabel" id="clockLabel"></div>
 <div id="enemies"></div><div class="forecast" id="forecast"></div>
</section>
<section class="panel" aria-label="隊"><div class="topline"><strong>五人の輪</strong><span class="small">出発前: 二人を順にタップで交換</span></div><div class="team" id="team"></div><div class="notice" id="notice"></div></section>
<div id="result" class="result" role="status"></div>
<div class="controls"><button class="primary" id="auto">自動で進む</button><button id="step">一手進む</button><button class="reset" id="reset">組み直す</button></div>
<details class="panel" open><summary>十枚から各人A/Bを選ぶ</summary><div id="options"></div></details>
<section class="panel"><strong>いま起きたこと</strong><ol class="log" id="log" aria-live="polite"></ol></section>
<p class="warning">全技能を最初から有効にした試験版。解禁予約・装備・物語・本編の隊列は未実装。敵列と数字は仮で、勝ちやすさは調整していません。予測は次の波の構成だけです。</p>
</main>
<script>
(() => {
const names={N:'ナギ',H:'ヒバナ',T:'ツグミ',G:'ゴウ',Z:'ゲンゾウ'};
const maxHp={N:14,H:7,T:8,G:12,Z:8}, targetOrder=['N','G','H','Z','T'];
const waves=[
 [['雑兵',3,2],['雑兵',3,2]],[['雑兵',5,3]],[['雑兵',4,2],['雑兵',4,2]],
 [['首領',20,6]],[['雑兵',3,2],['雑兵',3,2],['雑兵',3,2]],
 [['雑兵',8,3],['縫い手',4,2]],[['雑兵',9,3],['雑兵',6,2]],
 [['首領',26,7]],[['雑兵',4,2],['雑兵',4,2],['雑兵',4,2]],
 [['雑兵',10,3],['縫い手',4,2]],[['雑兵',10,3],['雑兵',9,3]],
 [['首領',35,9],['縫い手',5,2]]
];
const cards={
 N:{A:['駆け込む盾','防壁1 / 0拍'],B:['返す盾','防壁2 / 1拍。防いだ量を一度返す']},
 H:{A:['早足','先頭へ1 / 0拍'],B:['裏取り','最後尾へ5 / 2拍']},
 T:{A:['狙撃と手当て','先頭へ2＋HP1回復 / 1拍'],B:['集中治療','先頭へ1＋HP3回復 / 1拍']},
 G:{A:['大槌','先頭へ7 / 2拍'],B:['なぎ倒し','先頭へ3 / 1拍。撃破で余り＋3が次へ']},
 Z:{A:['写し弩','直前の一撃を写す / 2拍'],B:['開戦の矢','この波の初射撃3、以後1 / 1拍']}
};
const $=id=>document.getElementById(id);
let order=['H','N','T','G','Z'], branch={N:'A',H:'A',T:'A',G:'A',Z:'A'};
let s, timer=null, selected=null;
function note(msg){s.log.unshift(msg);s.log=s.log.slice(0,14)}
function enter(){
 if(s.wave>=12)return;
 const idx=s.wave; s.enemies=waves[idx].map(([name,hp,atk],j)=>({id:`${idx}-${j}`,name,hp,max:hp,atk}));
 s.wave++;s.clock=0;s.lastWaveHit={};
 if(s.wave===5||s.wave===9){for(const k of Object.keys(names)){s.hp[k]=s.hp[k]===0?2:s.hp[k]+Math.ceil((maxHp[k]-s.hp[k])/2)}note('野営の回復。隊は止まらず進む')}
 note(`第${s.wave}波が来た。次は${names[order[s.seat%5]]}`);
}
function fresh(){
 stop();selected=null;s={hp:{...maxHp},shield:{N:0,H:0,T:0,G:0,Z:0},wave:0,enemies:[],clock:0,seat:0,lastPower:null,lastZWave:0,lastWaveHit:{},log:[],started:false,ended:false,steps:0,enemyPhases:0};enter();render();
}
function stop(){if(timer){clearInterval(timer);timer=null}}
function hurtEnemy(value,index=0,spill=0,source='攻撃'){
 if(!s.enemies.length)return; let pos=Math.min(index,s.enemies.length-1),used=false;
 while(value>0&&pos<s.enemies.length){
  let e=s.enemies[pos],deal=Math.min(value,e.hp);e.hp-=deal;value-=deal;
  note(`${source} → ${e.name} -${deal}${e.hp===0?' 撃破':''}`);
  if(e.hp>0)break;
  s.enemies.splice(pos,1);
  if(!s.enemies.length)enter();
  if(!spill||used)break;
  value+=spill;used=true;note(`余りに+${spill}して次の敵へ`);
 }
}
function heal(value){
 const alive=targetOrder.filter(k=>s.hp[k]>0);if(!alive.length)return;
 const k=alive.reduce((best,k)=>(maxHp[k]-s.hp[k])>(maxHp[best]-s.hp[best])?k:best,alive[0]);
 const amount=Math.min(value,maxHp[k]-s.hp[k]);s.hp[k]+=amount;if(amount)note(`ツグミ → ${names[k]}を${amount}回復`);
}
function enemyPhase(){
 s.enemyPhases++;s.lastPower=null;note('五拍満了。生き残った敵が動く');
 let reflected=false;
 for(const e of [...s.enemies]){
  if(!s.enemies.includes(e))continue;
  if(e.name==='縫い手'){
   const front=s.enemies[0];if(front){const amount=Math.min(2,front.max-front.hp);front.hp+=amount;if(amount)note(`縫い手 → ${front.name}を${amount}回復`)}
   continue;
  }
  const k=targetOrder.find(k=>s.hp[k]>0);if(!k)break;
  const blocked=Math.min(e.atk,s.shield[k]);s.shield[k]-=blocked;
  const actual=Math.min(s.hp[k],e.atk-blocked);s.hp[k]-=actual;
  note(`${e.name} → ${names[k]} 防壁${blocked}、HP-${actual}`);
  if(k==='N'&&branch.N==='B'&&blocked&&!reflected){
   reflected=true;e.hp-=blocked;note(`ナギの返す盾 → ${e.name} -${blocked}`);
   if(e.hp<=0){s.enemies.splice(s.enemies.indexOf(e),1);if(!s.enemies.length)enter()}
  }
 }
}
function checkEnd(){
 if(!targetOrder.some(k=>s.hp[k]>0)){s.ended=true;stop();note(`敗北。第${s.wave}波まで進んだ`)}
 else if(s.wave===12&&!s.enemies.length){s.ended=true;stop();note('十二波を連破！')}
}
function step(){
 if(s.ended)return;
 s.started=true;let k=order[s.seat%5],before=s.wave,cost=1,mode=branch[k];s.seat++;s.steps++;
 if(s.hp[k]<=0){s.lastPower=null;note(`${names[k]}は倒れている。空席が1拍進む`)}
 else if(k==='N'){
  cost=mode==='A'?0:1;let v=mode==='A'?1:2;
  let gained=Math.min(v,3-s.shield.N);s.shield.N+=gained;note(`ナギ: 防壁+${gained}、${cost}拍`);
 }else if(k==='H'){
  cost=mode==='A'?0:2;let power=mode==='A'?1:5;
  hurtEnemy(power,mode==='B'?s.enemies.length-1:0,0,'ヒバナ');s.lastPower=power;
 }else if(k==='T'){
  let power=mode==='A'?2:1;hurtEnemy(power,0,0,'ツグミ');heal(mode==='A'?1:3);s.lastPower=power;
 }else if(k==='G'){
  let power=mode==='A'?7:3;cost=mode==='A'?2:1;
  hurtEnemy(power,0,mode==='B'?3:0,'ゴウ');s.lastPower=power;
 }else if(k==='Z'){
  let power;if(mode==='A'){power=s.lastPower||1;cost=2}else{power=s.lastZWave!==s.wave?3:1}
  const attackedWave=s.wave;hurtEnemy(power,0,0,'ゲンゾウ');s.lastPower=power;s.lastZWave=attackedWave;
 }
 if(s.wave===12&&!s.enemies.length){checkEnd();render();return}
 if(before===s.wave){s.clock+=cost;note(`${names[k]}の${cost}拍 → ${s.clock}/5`);
  if(s.clock>=5){s.clock-=5;enemyPhase()}
 }else{note(`波を越えたので、新しい敵の時計は0/5`)}
 checkEnd();render();
}
function render(){
 $('waveTitle').textContent=s.ended?(s.enemies.length?'遠征はここまで':'十二波を連破'):`第${s.wave}波 / 12`;
 $('phase').textContent=`${s.steps}手 / 敵行動${s.enemyPhases}回`;
 $('progress').innerHTML=waves.map((_,i)=>`<i class="${i<s.wave-1?'done':i===s.wave-1?'now':''}"></i>`).join('');
 $('clock').innerHTML=Array.from({length:5},(_,i)=>`<span class="${i<s.clock?'used':''}"></span>`).join('');
 $('clockLabel').textContent=`敵の反撃まであと${Math.max(0,5-s.clock)}拍。0拍技は時計を進めない。`;
 $('enemies').innerHTML=s.enemies.length?s.enemies.map((e,i)=>`<div class="enemy ${i===0?'front':''}"><span class="name">${e.name}</span><span class="small">${e.name==='縫い手'?'治療2':`攻撃${e.atk}`}</span><span class="bar"><i style="width:${Math.max(0,100*e.hp/e.max)}%"></i></span><span class="hp">${e.hp}/${e.max}</span></div>`).join(''):'<div class="small">敵はいない</div>';
 const upcoming=waves[s.wave];$('forecast').innerHTML=upcoming?`少し先: <b>第${s.wave+1}波</b>　${upcoming.map(([n,h,a])=>`${n} HP${h} ${n==='縫い手'?'治療2':`攻撃${a}`}`).join(' / ')}`:'少し先: 最後の波';
 $('team').innerHTML=order.map((k,i)=>`<button class="hero ${s.hp[k]===0?'dead':''} ${!s.ended&&i===s.seat%5?'next':''} ${selected===i?'selected':''}" data-seat="${i}" ${s.started?'disabled':''}><strong>${names[k]}</strong><span class="v">♥${s.hp[k]}/${maxHp[k]}</span><span class="v">盾${s.shield[k]}・${branch[k]}</span></button>`).join('');
 $('notice').textContent=s.started?'五人の順番は出発時に確定。':selected===null?'二人の位置を交換できます。':`${names[order[selected]]}と交換する人を選ぶ。`;
 $('result').textContent=s.ended?(s.enemies.length?'敗北。組み直して再挑戦。':'十二波を連破！') : '';
 $('log').innerHTML=s.log.map(x=>`<li>${x}</li>`).join('');
 $('auto').textContent=timer?'停止':'自動で進む';$('auto').disabled=s.ended;
 $('step').disabled=s.ended;
 for(const button of $('options').querySelectorAll('button'))button.disabled=s.started;
}
function options(){
 $('options').innerHTML=Object.keys(names).map(k=>`<div class="option"><strong>${names[k]}</strong><div class="choices">${['A','B'].map(x=>`<button data-option="${k}" data-branch="${x}"><b>${x} ${cards[k][x][0]}</b><small>${cards[k][x][1]}</small></button>`).join('')}</div></div>`).join('');refreshOptions();
}
function refreshOptions(){
 for(const k of Object.keys(names)){
  for(const button of $('options').querySelectorAll(`[data-option="${k}"]`))button.classList.toggle('active',button.dataset.branch===branch[k]);
 }
}
function auto(){if(timer){stop();render();return}if(s.ended)return;timer=setInterval(()=>{step();if(s.ended)stop()},310);render()}
$('auto').addEventListener('click',auto);$('step').addEventListener('click',step);$('reset').addEventListener('click',fresh);
$('team').addEventListener('click',e=>{const b=e.target.closest('[data-seat]');if(!b||s.started)return;let i=Number(b.dataset.seat);if(selected===null){selected=i}else{[order[selected],order[i]]=[order[i],order[selected]];selected=null}render()});
$('options').addEventListener('click',e=>{const b=e.target.closest('[data-option]');if(!b||s.started)return;branch[b.dataset.option]=b.dataset.branch;refreshOptions();render()});
options();fresh();
})();
</script>
</body></html>
