<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10131c" />
    <title>火走り / EMBERLINE 0.1</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"><main class="boot-screen"><span>機関を起こしています…</span></main></div>
    <script>
      function showBootFailure() {
        var app = document.getElementById("app");
        if (app && app.querySelector(".boot-screen")) {
          app.innerHTML = '<main class="boot-screen"><h1>火走り</h1><p>機関の読み込みに失敗しました。ページを再読み込みしてください。</p></main>';
        }
      }
      window.addEventListener("error", showBootFailure, true);
      window.addEventListener("unhandledrejection", showBootFailure);
      window.showBootFailure = showBootFailure;
      window.setTimeout(function () {
        var app = document.getElementById("app");
        if (app && app.querySelector(".boot-screen")) showBootFailure();
      }, 6000);
    </script>
    <script type="module" src="./release.mjs" onerror="window.showBootFailure()"></script>
  </body>
</html>
