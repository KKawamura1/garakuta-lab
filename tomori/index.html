<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="小さな灯りに三日間、何を覚えさせるかを選ぶ育成ゲーム。" />
    <title>灯守 / TOMORI 0.1</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"><main class="boot-screen"><div class="boot-orb">✧</div><p>小さな灯りを起こしています…</p></main></div>
    <script>
      function showBootFailure() {
        var app = document.getElementById("app");
        if (!app || (app.dataset.ready === "true" && !app.querySelector(".boot-screen"))) return;
        app.innerHTML = '<main class="boot-screen"><div class="boot-orb">·</div><h1>灯りが眠っています</h1><p>読み込みに失敗しました。ページを一度だけ再読み込みしてください。</p></main>';
      }
      window.addEventListener("error", showBootFailure, true);
      window.addEventListener("unhandledrejection", showBootFailure);
      window.showBootFailure = showBootFailure;
      window.setTimeout(function () {
        var app = document.getElementById("app");
        if (app && app.querySelector(".boot-screen")) showBootFailure();
      }, 5000);
    </script>
    <script type="module" src="./release.mjs" onerror="window.showBootFailure()"></script>
  </body>
</html>
