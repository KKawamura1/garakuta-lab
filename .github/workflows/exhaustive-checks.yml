name: Exhaustive checks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 0"

permissions:
  contents: read

concurrency:
  group: exhaustive-checks
  cancel-in-progress: true

jobs:
  exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: analysis/check-all.sh (exhaustive)
        run: RUN_EXHAUSTIVE=1 bash analysis/check-all.sh
