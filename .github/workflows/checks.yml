name: Checks

# **関門は書いてあっただけで、誰も引いていなかった。**
#
# `analysis/check-all.sh` は公開前に走らせる約束だったが、走らせるのは人
# （とエージェント）の手だけだった。2026-08-20 から 08-25 まで、
# `analysis/smoke-core.mjs` は main の上で落ちたままで、その間ずっと
# 「勝つたびにブラウザで例外が出る」という不具合が公開されていた。
# 検査は存在していた。**発火する場所が無かっただけである。**
#
# AGENTS.md「散文に書いたルールは落ちる。瞬間に発火するルールは機械へ移すこと」

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 検査は core/ の .mjs しか読まないので、依存の導入は要らない。
      - name: analysis/check-all.sh
        run: bash analysis/check-all.sh
