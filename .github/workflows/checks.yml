name: 灰の遠征 checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current:
    name: Current implementation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npm init -y > /dev/null
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Syntax and ecology checks
        env:
          PLAYWRIGHT_MODULE: playwright
        run: bash analysis/check-all.sh
