<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>拾い火 / KINDLING 0.1</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"><main class="boot-screen"><span>夜をほどいています…</span></main></div>
    <script>
      (function () {
        function fail() {
          var app = document.getElementById("app");
          if (app && app.querySelector(".boot-screen")) {
            app.innerHTML = "<main class=\"boot-screen\"><h1>拾い火</h1><p>夜の読み込みに失敗しました。ページを再読み込みしてください。</p></main>";
          }
        }
        window.addEventListener("error", fail, true);
        window.addEventListener("unhandledrejection", fail);
        window.setTimeout(function () {
          var app = document.getElementById("app");
          if (app && app.querySelector(".boot-screen")) fail();
        }, 7000);
      }());
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
