<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ガラクタ・ラボ</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <div class="title" id="title">—</div>
        <div class="wave" id="wave">—</div>
      </div>
      <div class="spacer"></div>
      <button class="chip" id="gameButton" type="button">—</button>
      <button class="chip" id="helpButton" type="button">遊び方</button>
      <button class="chip" id="newRun" type="button">新しいラン</button>
    </header>

    <main id="screen"></main>

    <dialog id="helpDialog">
      <h2>遊び方</h2>
      <div id="helpBody" class="small"></div>
      <div class="actions" style="margin-top:12px"><button class="btn wide" id="closeHelp" type="button">閉じる</button></div>
    </dialog>

    <dialog id="gameDialog">
      <h2>どのゲームを遊ぶ</h2>
      <div class="small">選ぶと、いまのランを記録に残してから新しく始めます。</div>
      <div id="gameChoices" style="margin-top:10px"></div>
      <div class="actions" style="margin-top:12px"><button class="btn wide" id="closeGame" type="button">やめる</button></div>
    </dialog>

    <dialog id="markDialog">
      <h2>いまの気持ち</h2>
      <div class="actions" id="markChoices" style="margin-top:8px"></div>
      <label class="field" for="markNote">ひとこと（任意）</label>
      <input id="markNote" type="text" maxlength="120" />
      <div class="actions" style="margin-top:12px"><button class="btn wide" id="closeMark" type="button">閉じる</button></div>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
