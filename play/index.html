<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ガラクタ・ラボ</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="../icons/icon-180.png">
</head>
  <body>
    <!-- 上に貼り付く帯。**常に見たいものだけを置く。**
         作者の指摘：版名・seed・build・ボタン4つで161px（画面の19%）を占めていたが、
         そこは「敵のHPと攻撃」「装備中の部品」を見たい場所だった。
         版の切り替えや遊び方は、遊んでいる最中には要らないので「⋯」の中へ移した。 -->
    <header class="top">
      <div class="topline">
        <span class="title" id="title">—</span>
        <span class="wave" id="wave">—</span>
        <span class="spacer"></span>
        <button class="chip" id="menuButton" type="button" aria-label="メニュー">⋯</button>
      </div>
      <div class="vitals" id="vitals"></div>
      <div class="minislots" id="minislots"></div>
    </header>

    <main id="screen"></main>

    <dialog id="menuDialog">
      <h2>メニュー</h2>
      <div class="actions" style="display:grid; gap:8px; margin-top:10px">
        <button class="btn wide" id="gameButton" type="button">—</button>
        <button class="btn wide" id="helpButton" type="button">遊び方</button>
        <button class="btn wide" id="newRun" type="button">新しいラン</button>
      </div>
      <div class="small" style="margin-top:10px; opacity:.6" id="build"></div>
      <div class="actions" style="margin-top:10px"><button class="btn wide" id="closeMenu" type="button">閉じる</button></div>
    </dialog>

    <dialog id="helpDialog">
      <h2>遊び方</h2>
      <div id="helpBody" class="small"></div>
      <div class="actions" style="margin-top:12px"><button class="btn wide" id="closeHelp" type="button">閉じる</button></div>
    </dialog>

    <dialog id="gameDialog">
      <h2>どのゲームを遊ぶ</h2>
      <div class="small">選ぶと、いまのランを記録に残してから新しく始めます。</div>
      <div id="gameChoices" style="margin-top:10px"></div>
      <div class="actions" style="margin-top:12px"><button class="btn wide" id="closeGame" type="button">やめる</button></div>
    </dialog>

    <dialog id="markDialog">
      <h2>いまの気持ち</h2>
      <div class="actions" id="markChoices" style="margin-top:8px"></div>
      <label class="field" for="markNote">ひとこと（任意）</label>
      <input id="markNote" type="text" maxlength="120" />
      <div class="actions" style="margin-top:12px"><button class="btn wide" id="closeMark" type="button">閉じる</button></div>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
