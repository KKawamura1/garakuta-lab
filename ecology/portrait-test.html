<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111518">
    <title>顔サイズ確認 — DEVELOPMENT VIEW</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body class="portrait-calibration-page">
    <main class="shell portrait-calibration-shell">
      <header class="header portrait-calibration-header">
        <div>
          <p class="kicker">DEVELOPMENT VIEW</p>
          <h1>顔サイズ確認</h1>
          <p class="subtitle">戦闘と戦闘予測で共有する5人の顔フレーム</p>
        </div>
        <a class="menu-button" href="./">ゲームへ戻る</a>
      </header>

      <section class="card portrait-calibration-card" aria-labelledby="portrait-calibration-title">
        <div class="section-head">
          <div>
            <p class="eyebrow">PORTRAIT CALIBRATION</p>
            <h2 id="portrait-calibration-title">同じ基準で比較</h2>
          </div>
          <span class="count">5人</span>
        </div>
        <p class="muted">実際の戦闘・予測と同じ顔切り出し、キャラクター別補正、濃い情報帯を並べています。名前と職種アイコンは画像へ重ねません。</p>
        <div id="portrait-calibration-root"></div>
        <p class="portrait-calibration-note">水平の点線は目元の比較用ガイドです。ここで顔の大きさと目の見え方が揃っていれば、下の2画面にも同じ補正が反映されます。</p>
      </section>
    </main>
    <script type="module" src="./portrait-test.js"></script>
  </body>
</html>
