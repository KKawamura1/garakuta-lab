<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111518">
    <title>攻撃演出の見本 — DEVELOPMENT VIEW</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <p class="kicker">DEVELOPMENT VIEW</p>
          <h1>攻撃演出の見本</h1>
          <p class="subtitle">腕力＝斬撃 ／ 技術＝銃撃。本番の戦闘と同じ経路・同じCSSで出します</p>
        </div>
        <a class="menu-button" href="./">ゲームへ戻る</a>
      </header>

      <section class="card" aria-labelledby="fx-environment-title">
        <div class="section-head">
          <div>
            <p class="eyebrow">ENVIRONMENT</p>
            <h2 id="fx-environment-title">この端末の状態</h2>
          </div>
        </div>
        <div id="fx-environment"></div>
      </section>

      <section class="card" aria-labelledby="fx-stage-title">
        <div class="section-head">
          <div>
            <p class="eyebrow">MOTION</p>
            <h2 id="fx-stage-title">出して見る</h2>
          </div>
        </div>
        <div id="fx-stage"></div>
        <div id="fx-controls"></div>
      </section>
    </main>
    <script type="module" src="./fx-test.js"></script>
  </body>
</html>
