<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111719">
    <title>技能の森 — 武器技能UIプレビュー</title>
    <link rel="stylesheet" href="./weapon-skill-prototype.css">
  </head>
  <body>
    <main class="prototype-shell">
      <header class="page-head">
        <a class="back-link" href="./">本編へ戻る</a>
        <div class="heading">
          <p class="eyebrow">WEAPON SKILLS · UI PREVIEW</p>
          <h1>技能の森</h1>
        </div>
        <span class="prototype-mark">表示試作</span>
      </header>

      <aside class="fixture-note" aria-label="プレビューについて">
        <span class="note-mark" aria-hidden="true">i</span>
        <p><b>固定データの閲覧画面</b><br>カタログ190節と画面配置を確認できます。取得・戦闘・保存には接続していません。構成・予約デモの変更はこのページ内だけで、再読み込みすると戻ります。</p>
      </aside>

      <nav id="screen-tabs" class="screen-tabs" role="tablist" aria-label="武器技能UIの画面">
        <button id="tab-tree" class="screen-tab" type="button" role="tab" aria-selected="true" aria-controls="tree-screen" data-screen="tree">ツリー</button>
        <button id="tab-loadout" class="screen-tab" type="button" role="tab" aria-selected="false" aria-controls="loadout-screen" data-screen="loadout" tabindex="-1">構成</button>
        <button id="tab-reservation" class="screen-tab" type="button" role="tab" aria-selected="false" aria-controls="reservation-screen" data-screen="reservation" tabindex="-1">予約</button>
      </nav>

      <section id="tree-screen" class="screen-view" role="tabpanel" aria-labelledby="tab-tree">
        <section class="picker card" aria-labelledby="picker-title">
        <div class="picker-heading">
          <h2 id="picker-title">武器技能</h2>
          <span id="visible-count" class="count-badge" aria-live="polite"></span>
        </div>
        <nav id="weapon-tabs" class="weapon-tree-tabs" role="tablist" aria-label="武器"></nav>
        <div id="tree-controls" class="weapon-tree-controls"></div>
      </section>

      <section id="skill-tree" class="skill-tree" aria-label="技能ツリー"></section>

      <section id="skill-detail" aria-label="選択した技能の説明" aria-live="polite"></section>
      </section>

      <section id="loadout-screen" class="screen-view" role="tabpanel" aria-labelledby="tab-loadout" hidden>
        <div id="loadout-content"></div>
      </section>

      <section id="reservation-screen" class="screen-view" role="tabpanel" aria-labelledby="tab-reservation" hidden>
        <div id="reservation-content"></div>
      </section>

      <footer class="page-foot">カタログの表示用効果文を掲載しています。</footer>
    </main>
    <script type="module" src="./weapon-skill-prototype.js"></script>
  </body>
</html>
