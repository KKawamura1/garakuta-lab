<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#111518">
    <title>One Battle Ahead — EXP-18 R10 Campaign 0.8</title>
    <link rel="stylesheet" href="./styles.css">
    <!-- タイトルの画は、app.js を待たずに取り始める（起動の読み込み画面が待つ相手）。 -->
    <link rel="preload" as="image" href="./art/title-cast.webp">

  <body>
    <main id="app" aria-live="polite">
      <!--
        app.js が届くまでの数百ミリ秒、画面を真っ暗にしない。**ここは「読み込み中」の

        書かない）。JS が動き出した時点で、この中身はまるごと置き換わる。
      -->
      <div class="shell title-shell">
        <div class="title-air" aria-hidden="true"></div>
        <section class="title-screen boot-screen boot-static">
          <div class="boot-bar" role="progressbar" aria-label="読み込み中"><i></i></div>
        </section>
      </div>
    </main>
    <script type="module" src="./app.runtime.js?build=pr288"></script>
